#
# Read by wpa_supplicant on top of its config (/vendor/etc/wifi/).
#
# No Wi-Fi Direct (P2P). rtw89 has no dedicated P2P device interface, so the
# supplicant would run P2P management on wlan0 itself and register wlan0 with
# the framework as a P2P interface; the framework then finds no station
# interface and Wi-Fi fails to turn on. The device does not declare
# android.hardware.wifi.direct either.
p2p_disabled=1
